name: IndexNow Submission

on:
  push:
    branches:
      - main

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Submit to IndexNow
        run: |
          RESPONSE=$(curl -s -w "%{http_code}" -X POST "https://api.indexnow.org/indexnow" \
          -H "Content-Type: application/json; charset=utf-8" \
          -d '{
            "host": "iluminarcvel.com.br",
            "key": "b7f3e4d5a6c7b8a9e0f1d2c3b4a59687",
            "keyLocation": "https://iluminarcvel.com.br/indexnow-key.txt",
            "urlList": [
              "https://iluminarcvel.com.br/",
              "https://iluminarcvel.com.br/instalacoes-eletricas/",
              "https://iluminarcvel.com.br/instalacao/",
              "https://iluminarcvel.com.br/higienizacao/",
              "https://iluminarcvel.com.br/seguranca-eletronica/",
              "https://iluminarcvel.com.br/automacao/",
              "https://iluminarcvel.com.br/iluminar-360/"
            ]
          }')
          STATUS=${RESPONSE: -3}
          echo "IndexNow returned status: $STATUS"
          if [[ "$STATUS" == "200" || "$STATUS" == "202" ]]; then
            echo "Submission successful."
          else
            echo "Submission failed with status $STATUS"
            exit 1
          fi
